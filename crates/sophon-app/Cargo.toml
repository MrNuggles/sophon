[package]
name = "sophon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sophon"
path = "src/main.rs"

[dependencies]
sophon-core = { path = "../sophon-core" }
sophon-docker = { path = "../sophon-docker", optional = true }
libc = "0.2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg", "unstable-winit-030", "system-tray"] }
# Not used directly: turns on runtime-loaded fontconfig inside Slint (no fontconfig-devel needed).
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }

[features]
# Optional feature tabs. "docker" is on by default (the tab itself still ships
# disabled — enable it in Settings → Tabs). `--no-default-features` builds
# without any network code at all.
default = ["docker"]
docker = ["dep:sophon-docker"]

[build-dependencies]
slint-build = "1.18"
