[workspace]
resolver = "3"
members = ["crates/sophon-core", "crates/sophon-app", "crates/sophon-docker"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds usable: optimise dependencies, not our own code.
[profile.dev.package."*"]
opt-level = 2
